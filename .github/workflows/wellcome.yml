name: Welcome to GitHub Actions

on:
  workflow_dispatch:

jobs:
  welcome:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run welcome message
        run: python .github/scripts/welcome.py
