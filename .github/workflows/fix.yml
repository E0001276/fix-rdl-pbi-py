name: Power BI FIX - Reusable

on:
  workflow_call:
    inputs:
      environment_name:
        description: Environment name shown in the workflow execution.
        required: true
        type: string
      config_file:
        description: Path to the fix-rdl-pbi-py workspace configuration file.
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true

permissions:
  contents: read

jobs:
  fix:
    name: Run Power BI FIX - ${{ inputs.environment_name }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Login to Azure with Service Principal
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_CLIENT_SECRET" || -z "$AZURE_TENANT_ID" ]]; then
            echo "ERROR: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and AZURE_TENANT_ID are required."
            exit 1
          fi

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --output none

      - name: Run Power BI FIX - ${{ inputs.environment_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Environment : ${{ inputs.environment_name }}"
          echo "Config      : ${{ inputs.config_file }}"
          python src/main.py --config "${{ inputs.config_file }}"
